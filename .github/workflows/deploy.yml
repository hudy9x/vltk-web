name: Deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vltk-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Install map editor test dependencies
        run: npx --yes pnpm@10.25.0 --dir tools/map-tool install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://gamelab.hudy9x.com
    steps:
      - name: Deploy verified commit through restricted SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/vltk-deploy-key"
          hosts_file="$RUNNER_TEMP/vltk-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts_file"
          ssh -p 26266 -i "$key_file" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            root@103.121.91.177 "deploy $GITHUB_SHA"
      - name: Verify public HTTPS endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          if curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 2 --connect-timeout 10 --max-time 30 \
            --output "$response_file" https://gamelab.hudy9x.com/api/health; then
            python3 - "$response_file" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1]) as response:
                  payload = json.load(response)
          except (ValueError, OSError) as error:
              sys.exit(f"Public health endpoint returned invalid JSON: {error}")
          if not isinstance(payload, dict) or payload.get("ok") is not True:
              sys.exit('Public health endpoint did not return {"ok": true}')
          print("Public HTTPS health check passed.")
          PY
          else
            status=$?
            echo "::error::Public HTTPS health check failed (curl exit $status). VPS deployment completed, but public reachability could not be verified. For HTTP 522, check Cloudflare-to-origin connectivity, DNS, nginx, and firewall rules."
            exit "$status"
          fi
