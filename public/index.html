<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1412">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Võ Lâm Idle</title>
<link rel="stylesheet" href="fonts/ibm-plex-mono.css">
<link rel="stylesheet" href="style.css?v=622">
<link rel="stylesheet" href="jx1ui.css?v=622">
<link rel="stylesheet" href="jx1ui2.css?v=622">
<link rel="stylesheet" href="ui20.css?v=622">
<style>
#appLoading{position:fixed;inset:0;z-index:100002;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#263326,#101612 65%);color:#eadbb4;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box}
#appLoading[hidden]{display:none}#appLoading .loading-card{width:min(100%,380px);text-align:center}
#appLoading .loading-mark{color:#bda365;letter-spacing:5px;font-size:11px;margin-bottom:18px}#appLoading h1{font-family:serif;font-size:32px;letter-spacing:4px;margin:0 0 36px;color:#f2d18c}
#appLoading progress{display:block;width:100%;height:8px;margin:18px 0 12px;accent-color:#d1ad64;border:0;border-radius:4px;overflow:hidden;background:#354036}
#appLoading progress::-webkit-progress-bar{background:#354036}#appLoading progress::-webkit-progress-value{background:#d1ad64}#appLoading progress::-moz-progress-bar{background:#d1ad64}
#appLoading [data-loading-label]{font-size:14px;line-height:1.6}#appLoading [data-loading-count]{min-height:36px;font-size:12px;color:#b7b9a7;line-height:1.6}
#appLoading button{margin-top:16px;padding:10px 22px;border:1px solid #9f834a;border-radius:5px;background:#3c3421;color:#f2ddb1;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="appLoading" aria-label="Đang chuẩn bị game" aria-busy="true"><div class="loading-card">
  <div class="loading-mark">TRỞ LẠI GIANG HỒ</div><h1>VÕ LÂM IDLE</h1>
  <div data-loading-label role="status" aria-live="polite">Đang kết nối máy chủ…</div>
  <progress max="1" aria-label="Tiến độ tải tài nguyên"></progress><div data-loading-count></div>
  <button type="button" hidden>Thử tải lại</button>
</div></div>
<div id="app">
  <header id="top">
    <div class="lvbox"><span id="lv">1</span></div>
    <div class="topmid">
      <div class="row"><b id="heroName">Võ Lâm Idle</b><span id="stageLbl"></span></div>
    </div>
    <button id="ktcBtn" title="Kỳ Trân Các">Kỳ Trân Các</button>
    <div class="gold"><span class="coin"></span><span id="gold">0</span><img class="knbi" src="img/ep/knb.png" alt=""><span id="knbTop">0</span></div>
    <button id="actBtn" title="Nhiệm vụ · Hoạt động">⚔</button>
    <button id="giftBtn" title="Phần thưởng">🎁</button>
    <button id="compactBtn" title="Thu gọn / mở rộng sân đấu">⛶</button>
  </header>

  <section id="battle">
    <div id="bg"></div>
    <canvas id="arena"></canvas>
    <div id="hud">
      <div class="jxs"><span>Cấp</span><b id="lvS">1</b></div>
      <div class="bar hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
      <div class="bar mp"><i id="mpBar"></i><span id="mpTxt"></span></div>
      <div class="bar xp"><i id="xpBar"></i><span id="xpTxt"></span></div>
      <div class="jxs" title="Lực tay phải (sát thương chiêu chính)"><span>Lực tay</span><b id="pwS">0</b></div>
      <div id="mainSk"></div>
    </div>
    <div id="topCtl"><button id="rideBtn" class="chip"></button><button id="rotBtn" class="chip"></button><button id="ctrlBtn" class="chip"></button></div>
    <button id="inBtn" class="chip"></button>
    <button id="bBack" class="hidden" type="button" title="Trở lại bãi luyện công" aria-label="Trở lại bãi luyện công"></button>
    <div id="pad">
      <div class="hb">
        <button class="pbtn pot hp" id="bHp" title="Thuốc sinh lực (phím 1)"><i></i><div class="cd"></div><em></em><b>1</b><s class="pk">▾</s></button>
        <button class="pbtn pot mp" id="bMp" title="Thuốc nội lực (phím 2)"><i></i><div class="cd"></div><em></em><b>2</b><s class="pk">▾</s></button>
        <button class="pbtn pot tp" id="bTp" title="Thổ Địa Phù (phím 3)"><i></i><div class="cd"></div><b>3</b></button>
      </div>
      <div class="hb"><button class="pbtn mn" id="bMain"><i></i></button></div>
      <div class="hb">
        <button class="pbtn sk" data-i="0" title=""><i></i><div class="cd"></div><em class="skremain"></em><b>F1</b><s class="pk">▾</s></button>
        <button class="pbtn sk" data-i="1" title=""><i></i><div class="cd"></div><em class="skremain"></em><b>F2</b><s class="pk">▾</s></button>
        <button class="pbtn sk" data-i="2" title=""><i></i><div class="cd"></div><em class="skremain"></em><b>F3</b><s class="pk">▾</s></button>
        <button class="pbtn sk" data-i="3" title=""><i></i><div class="cd"></div><em class="skremain"></em><b>F4</b><s class="pk">▾</s></button>
      </div>
    </div>
  </section>

  <main id="panel">
    <div class="tab" id="t-log"></div>
    <div class="tab hidden" id="t-char"></div>
    <div class="tab hidden" id="t-skill"></div>
    <div class="tab hidden" id="t-inv"></div>
    <div class="tab hidden" id="t-forge"></div>
    <div class="tab hidden" id="t-quest"></div>
    <div class="tab hidden" id="t-more"></div>
  </main>

  <nav id="tabs">
    <button data-t="log" class="on">Giang hồ</button>
    <button data-t="char">Nhân vật<em class="dot" id="dotChar"></em></button>
    <button data-t="inv">Hành trang</button>
    <button data-t="skill">Võ công<em class="dot" id="dotSkill"></em></button>
    <button data-t="forge">Lò rèn<em class="dot" id="dotForge"></em></button>
    <button data-t="quest">Nhiệm vụ<em class="dot" id="dotQuest"></em></button>
    <button id="tabRide" class="tride tteam">Tổ đội</button>
    <button data-t="more">Hệ thống</button>
  </nav>

  <div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="mbox" tabindex="-1"><button class="mx" id="mClose">✕</button><div id="mBody"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="client/loading.js"></script>
<script src="client/bootstrap.js"></script>
</body>
</html>
