# Node listens on loopback; only nginx is exposed publicly.
server {
    listen 80;
    server_name 103.121.91.177;
    return 301 https://gamelab.hudy9x.com$request_uri;
}

server {
    listen 80;
    server_name gamelab.hudy9x.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://gamelab.hudy9x.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name gamelab.hudy9x.com;
    server_tokens off;
    client_max_body_size 8000000;
    ssl_certificate /etc/letsencrypt/live/gamelab.hudy9x.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamelab.hudy9x.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VltkTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Public map bytes bypass Node and use nginx streaming, ETag and HTTP caching.
    location ~ ^/app/maps/(?:content/[1-9][0-9]*|objects)/[a-zA-Z0-9_/-]+\.(?:png|jpg|jpeg|webp)$ {
        root /opt/vltk-web/public;
        try_files $uri =404;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare's public edge is the peer. Do not trust arbitrary client-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
